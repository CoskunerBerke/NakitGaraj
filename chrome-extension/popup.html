<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
    }
    .badge {
      background: #0284c7;
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.4;
    }
    .success {
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">NakitGaraj</div>
    <div class="badge">v1.0</div>
  </div>
  <button id="importBtn" class="btn">🚀 Bu Sayfadaki İlanları Aktar</button>
  <div id="status" class="status">Açık olan Sahibinden sayfasındaki tüm ilan verilerini çeker ve NakitGaraj'a kaydeder.</div>

  <script src="popup.js"></script>
</body>
</html>
