version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nakitgaraj_postgres
    restart: always
    # Values come from the root .env file (copy .env.example to .env).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nakitgaraj_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-nakitgaraj_db}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nakitgaraj_redis
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
